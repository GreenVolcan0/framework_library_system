{% extends "base.html" %}

{% block title %}Главная – Libris{% endblock %}

{% block content %}
    <h1 class="display-4">Libris</h1>

    <p class="lead">Система учёта выдачи книг в библиотеке.</p>

    <p>
        Книг в каталоге: {{ books_count }}.
        Сейчас на руках: {{ active_count }}.
    </p>

    <p>Основные разделы:</p>
    <a href="{% url 'books:list' %}" class="btn btn-primary me-2">Книги</a>
    <a href="{% url 'loans:list' %}" class="btn btn-secondary">Выдачи</a>
{% endblock %}
